[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sqltriage"
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avery Lane" }]

[project.optional-dependencies]
odbc = ["pyodbc>=4.0.30"]

[project.scripts]
sqltriage = "sqltriage.cli:main"
